[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
raw-window-handle = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
ghostty-sys = "0.1.1"
objc2 = { version = "0.5.2", default-features = false, features = ["alloc", "std"] }
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["std", "NSApplication", "NSRunningApplication", "NSGraphics", "NSWindow", "NSView", "NSEvent", "NSResponder", "objc2-quartz-core"] }
objc2-foundation = { version = "0.2.2", default-features = false, features = ["std", "block2", "NSObject", "NSThread", "NSRunLoop", "NSTimer", "NSDate", "NSString", "NSGeometry", "NSNotification", "NSObjCRuntime"] }
block2 = { version = "0.5.1", default-features = false, features = ["std"] }
objc2-quartz-core = { version = "0.2.2", default-features = false, features = ["std", "CALayer"] }
